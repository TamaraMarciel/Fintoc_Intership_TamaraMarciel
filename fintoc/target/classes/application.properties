spring.application.name=Fintoc

# Puerto del Servidor
server.port=8080
server.servlet.context-path=/

# Configuración de Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/fintoc_db
spring.datasource.username=fintoc_user
spring.datasource.password=fintoc_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Archivos Estáticos
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/META-INF/resources/

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
