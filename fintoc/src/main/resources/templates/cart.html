<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333333;
            padding: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .navbar h1 {
            font-size: 1.8em;
            color: white;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover {
            background-color: white;
            color: #000000;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background-color: white;
            color: #000000;
        }

        .cart-badge {
            background-color: #FF6B6B;
            border-radius: 50%;
            padding: 5px 10px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            background: #000000;
            color: white;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #000000;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .cart-items {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }

        .cart-items h2 {
            margin-bottom: 20px;
            color: #333333;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            align-items: center;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 5px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            flex-shrink: 0;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .item-price {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .item-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .quantity-input {
            width: 50px;
            padding: 5px;
            border: 1px solid #FFD700;
            border-radius: 3px;
            text-align: center;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        .update-btn {
            background-color: #4ECDC4;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .update-btn:hover {
            background-color: #3fb8b0;
        }

        .item-subtotal {
            text-align: right;
            min-width: 80px;
        }

        .subtotal-value {
            font-weight: bold;
            color: #FFD700;
            font-size: 1.1em;
        }

        .remove-btn {
            background-color: #FF6B6B;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .remove-btn:hover {
            background-color: #ee5a52;
        }

        .cart-summary {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
            border: 1px solid #e0e0e0;
        }

        .cart-summary h2 {
            margin-bottom: 20px;
            color: #333333;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.3em;
            font-weight: bold;
            color: #FF6B6B;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .checkout-btn {
            width: 100%;
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            background-color: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .continue-shopping {
            background-color: #4ECDC4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        .continue-shopping:hover {
            background-color: #3fb8b0;
        }

        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-buttons {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🛒 Tienda</h1>
        <div class="nav-buttons">
            <a href="/" class="nav-btn">Tienda</a>
            <a href="/cart" class="nav-btn active">Carrito <span class="cart-badge" th:text="${cartCount}"></span></a>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>Mi Carrito de Compras</h1>
        </header>

        <div th:if="${!cartItems.isEmpty()}">
            <div class="cart-content">
                <div class="cart-items">
                    <h2>Productos en tu carrito</h2>
                    <div th:each="item : ${cartItems}" class="cart-item">
                        <div class="item-image" th:if="${item.foto != null}">
                            <img th:src="${item.foto}" alt="Foto del producto">
                        </div>
                        <div class="item-image" th:if="${item.foto == null}">
                            🛍️
                        </div>

                        <div class="item-details">
                            <div class="item-name" th:text="${item.productName}"></div>
                            <div class="item-price" th:text="${'Precio: $' + #numbers.formatDecimal(item.precio, 0, 'COMMA', 0, 'POINT')}"></div>
                            <form th:action="@{/update-cart}" method="post" class="item-controls">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <input type="number" name="cantidad" th:value="${item.cantidad}" min="1" class="quantity-input">
                                <button type="submit" class="update-btn">Actualizar</button>
                                <a th:href="@{/remove-from-cart(productId=${item.productId})}" class="remove-btn" onclick="return confirm('¿Eliminar producto?')">Eliminar</a>
                            </form>
                        </div>

                        <div class="item-subtotal">
                            <div class="subtotal-value" th:text="${'$' + #numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></div>
                        </div>
                    </div>
                </div>

                <div class="cart-summary">
                    <h2>Resumen del Pedido</h2>
                    <div class="summary-total">
                        <span>Total:</span>
                        <span th:text="${'$' + #numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                    <button class="checkout-btn">Proceder al Pago</button>
                    <a href="/" class="continue-shopping">Continuar Comprando</a>
                </div>
            </div>
        </div>

        <div th:if="${cartItems.isEmpty()}" class="empty-cart">
            <div class="empty-cart-icon">🛒</div>
            <h3>Tu carrito está vacío</h3>
            <p>Comienza a agregar productos a tu carrito</p>
            <a href="/" class="continue-shopping">Ir a la Tienda</a>
        </div>
    </div>
</body>
</html>
